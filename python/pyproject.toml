[build-system]
requires = [
    "scikit-build-core >= 1.0",
    "cython >= 3.1",
    # Needed for build-time stub docstring extraction
    "libcst>=1.9.0; python_version >= '3.15'",
    "libcst>=1.8.6; python_version < '3.15'",
    "numpy>=2.0",
    "setuptools_scm[toml]>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyarrow"
dynamic = ["version"]
requires-python = ">=3.11"
description = "Python library for Apache Arrow"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = [
    "LICENSE.txt",
    "NOTICE.txt",
]
classifiers  = [
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Free Threading :: 2 - Beta',
]
maintainers = [
    {name = "Apache Arrow Developers", email = "dev@arrow.apache.org"}
]

[project.urls]
Homepage = "https://arrow.apache.org/"
Documentation = "https://arrow.apache.org/docs/python"
Repository = "https://github.com/apache/arrow"
Issues = "https://github.com/apache/arrow/issues"

[dependency-groups]
test = [
    'pytest',
    'hypothesis',
    'cffi',
    'pytz',
    'pandas'
]

[tool.numpydoc_validation]
checks = [
    "GL10",
    "PR01",
    "PR03",
    "PR04",
    "PR05",
    "PR10",
    "RT03",
    "YD01",
]
exclude = [
    '\._.*$',
]

[tool.scikit-build]
cmake.build-type = "Release"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["pyarrow/_generated_version.py", "cmake_modules/", "pyarrow-stubs/"]
wheel.packages = ["pyarrow"]
wheel.install-dir = "pyarrow"
# TODO(GH-32609): Remove this when stubfiles are complete
# Withhold the PEP 561 marker until the type stubs are complete. The .pyi files
# are also temporarily omitted from wheels, so type checkers don't rely on the
# incomplete stubs and break downstream users (GH-49831). py.typed is kept
# in-tree for CI type-checking.
wheel.exclude = ["pyarrow/py.typed"]

[tool.scikit-build.sdist.force-include]
"../LICENSE.txt" = "LICENSE.txt"
"../NOTICE.txt" = "NOTICE.txt"

[tool.scikit-build.cmake.define]
PYARROW_BUNDLE_ARROW_CPP = {env = "PYARROW_BUNDLE_ARROW_CPP", default = "OFF"}
PYARROW_BUNDLE_CYTHON_CPP = {env = "PYARROW_BUNDLE_CYTHON_CPP", default = "OFF"}
PYARROW_GENERATE_COVERAGE = {env = "PYARROW_GENERATE_COVERAGE", default = "OFF"}
PYARROW_CXXFLAGS = {env = "PYARROW_CXXFLAGS", default = ""}
PYARROW_REQUIRE_STUB_DOCSTRINGS = {env = "PYARROW_REQUIRE_STUB_DOCSTRINGS", default = "OFF"}

[tool.setuptools_scm]
root = '..'
version_file = 'pyarrow/_generated_version.py'
version_scheme = 'guess-next-dev'
git_describe_command = 'git describe --dirty --tags --long --match "apache-arrow-[0-9]*.*"'
fallback_version = '27.0.0a0'

# TODO: Enable type checking once stubs are merged
[tool.mypy]
files = ["pyarrow-stubs"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/pyarrow-stubs"
exclude = [
    "^pyarrow/",
    "^benchmarks/",
    "^examples/",
    "^scripts/",
]

# Modules that will be annotated in later PRs (GH-32609). Treat them as Any
# rather than type checking their sources.
[[tool.mypy.overrides]]
module = ["pyarrow._compute", "pyarrow.compute", "pyarrow.interchange.*"]
follow_imports = "skip"

# TODO: Enable type checking once stubs are merged
[tool.pyright]
pythonPlatform = "All"
pythonVersion = "3.11"
include = ["pyarrow-stubs"]
exclude = [
    "pyarrow",
    "benchmarks",
    "examples",
    "scripts",
    "build",
]
stubPath = "pyarrow-stubs"
typeCheckingMode = "basic"
# The type annotation tests use `# type: ignore[...]` to assert that some
# usage is rejected, so an ignore that is no longer needed is an error there.
executionEnvironments = [
    { root = "pyarrow-stubs/tests", reportUnnecessaryTypeIgnoreComment = "error" },
    { root = "." },
]
# In editable install, pyright finds the stubs but compiled modules (e.g. pyarrow.lib)
reportMissingModuleSource = false

# TODO: Enable type checking once stubs are merged
[tool.ty.environment]
extra-paths = ["pyarrow-stubs"]

[tool.ty.analysis]
# Modules that will be annotated in later PRs (GH-32609), and the optional
# sparse dependency, which has no type hints. Treat them as Any.
replace-imports-with-any = [
    "pyarrow._compute",
    "pyarrow.compute",
    "pyarrow.interchange.**",
    "sparse",
]

[tool.ty.src]
include = ["pyarrow-stubs"]
exclude = [
    "pyarrow",
    "benchmarks",
    "examples",
    "scripts",
]

# numpy, pandas and scipy are optional dependencies. A `ty: ignore` comment on
# their imports would be reported as unused whenever they are installed.
[[tool.ty.overrides]]
include = ["pyarrow-stubs/pyarrow/**"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

# ty doesn't honor `# type: ignore[<mypy code>]` comments, so disable the
# rules that those comments suppress for mypy.
[[tool.ty.overrides]]
include = ["pyarrow-stubs/pyarrow/__lib/array.pyi"]
[tool.ty.overrides.rules]
# Some array classes override methods with a different signature at runtime.
invalid-method-override = "ignore"

[[tool.ty.overrides]]
include = ["pyarrow-stubs/tests/**"]
[tool.ty.overrides.rules]
# mypy and pyright check that the invalid usage in the tests is rejected.
invalid-argument-type = "ignore"

# Lints and formats the type stubs (*.pyi); see .pre-commit-config.yaml.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# PYI: the flake8-pyi rules for type stubs.
select = ["E", "F", "W", "PYI"]
