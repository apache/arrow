github:
  description: "Apache Arrow is the universal columnar format and multi-language toolbox for fast data interchange and in-memory analytics"
  homepage: https://arrow.apache.org/
  labels:
    - arrow
    - parquet

  features:
    issues: true
    projects: true
    discussions: true

  protected_branches:
    # protect main against force push
    main: {}

  collaborators:
    - alinaliBQ
    - AntoinePrv
    - EnricoMi
    - hiroyuki-sato
    - HyukjinKwon
    - Reranko05
    - rustyconover

  copilot_code_review:
    enabled: true
    review_drafts: false
    review_on_push: true

  pull_requests:
    # Limit the number of concurrently open pull requests a contributor
    # without write access can have. Pull requests over the cap can't be
    # opened; draft pull requests count towards the cap. See
    # https://arrow.apache.org/docs/dev/developers/bug_reports.html#pr-limit
    creation_cap:
      enabled: true
      max_open_pull_requests: 3
      include_drafts: true

notifications:
  commits:      commits@arrow.apache.org
  issues_status: issues@arrow.apache.org
  issues:       github@arrow.apache.org
  pullrequests: github@arrow.apache.org
  discussions: user@arrow.apache.org
  jira_options: link label worklog
