name: AI Disclosure

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      # Always run the script from main, never from the PR head.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Check AI disclosure
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/ai_disclosure/check.js`);
            await script({github, context, core});
