name: AI disclosure enforcement

on:
  workflow_run:
    workflows:
      - PR trigger
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enforce:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # Check out trusted code from the default branch, not the PR branch.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check AI disclosure
        uses: actions/github-script@v7
        with:
          script: |
            const checkDisclosure = require(
              "./.github/workflows/dev_pr/ai-check.js"
            );

            await checkDisclosure({github, context, core});
