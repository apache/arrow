name: Docs

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - '**'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/docs.yml'
      - 'cpp/apidoc/**'
      - 'docs/**'

concurrency:
  # Cancel superseded fork pushes; unrelated labels must not cancel running builds.
  group: "${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || (github.repository != 'apache/arrow' && github.ref) || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'CI: Upstream' }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARCHERY_DEBUG: 1
  ARROW_ENABLE_TIMING_TESTS: OFF
  DOCKER_VOLUME_PREFIX: ".docker/"

# Fork PRs to main run in the contributor's fork; CI: Upstream requests merge-ref validation.
jobs:

  complete:
    name: AMD64 Debian 12 Complete Documentation
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.pull_request.title, 'WIP') &&
      (github.event.action != 'labeled' || github.event.label.name == 'CI: Upstream') &&
      (github.event_name != 'pull_request' ||
       github.repository != 'apache/arrow' ||
       github.base_ref != 'main' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       contains(github.event.pull_request.labels.*.name, 'CI: Upstream'))
    timeout-minutes: 150
    env:
      JDK: 17
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free up disk space
        run: |
          ci/scripts/util_free_space.sh
      - name: Cache Docker Volumes
        uses: actions/cache@v6
        with:
          path: .docker
          key: debian-docs-${{ hashFiles('cpp/**') }}
          restore-keys: debian-docs-
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Setup Archery
        run: pip install -e dev/archery[docker]
      - name: Execute Docker Build
        env:
          ARCHERY_DOCKER_USER: ${{ secrets.DOCKERHUB_USER }}
          ARCHERY_DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          JDK: 17
        run: archery docker run debian-docs
      - name: Docker Push
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.repository == 'apache/arrow' &&
          github.ref_name == 'main'
        env:
          ARCHERY_DOCKER_USER: ${{ secrets.DOCKERHUB_USER }}
          ARCHERY_DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
        run: archery docker push debian-docs
