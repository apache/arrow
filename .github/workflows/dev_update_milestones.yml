name: Update issue milestones

on:
  schedule:
    - cron: "17 */6 * * *" # Every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update:
    name: Update milestones
    if: github.repository == 'apache/arrow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch maintenance branches
        run: |
          git fetch origin 'refs/heads/maint-*:refs/remotes/origin/maint-*'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Archery
        run: |
          pip install "dev/archery[release]"
      - name: Update milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archery release update-milestones --execute
