name: ODBC Windows Reusable
inputs:
  github-token:
    description: 'GITHUB_TOKEN for vcpkg caching'
    required: true
runs:
  using: "composite"
  steps:
    - name: Disable Crash Dialogs
      shell: pwsh
      run: |
        reg add `
          "HKCU\SOFTWARE\Microsoft\Windows\Windows Error Reporting" `
          /v DontShowUI `
          /t REG_DWORD `
          /d 1 `
          /f
    - name: Download Timezone Database
      shell: bash
      run: ci/scripts/download_tz_database.sh
    - name: Install ccache
      shell: bash
      run: |
        ci/scripts/install_ccache.sh 4.13.6 /usr
    - name: Setup ccache
      shell: bash
      run: |
        ci/scripts/ccache_setup.sh
    - name: ccache info
      id: ccache-info
      shell: bash
      run: |
        echo "cache-dir=$(ccache --get-config cache_dir)" >> $GITHUB_OUTPUT
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ${{ steps.ccache-info.outputs.cache-dir }}
        key: cpp-odbc-ccache-windows-x64-${{ hashFiles('cpp/**') }}
        restore-keys: cpp-odbc-ccache-windows-x64-
    - name: Install vcpkg
      shell: bash
      run: |
        # GH-55316: Use the vcpkg version pinned in .env and apply
        # ci/vcpkg/ports.patch like other vcpkg based builds do.
        ci/scripts/install_vcpkg.sh vcpkg
        VCPKG_ROOT=$(cygpath --windows "$(pwd)/vcpkg")
        echo "${VCPKG_ROOT}" >> "${GITHUB_PATH}"
        echo "VCPKG_ROOT=${VCPKG_ROOT}" >> "${GITHUB_ENV}"
        # We use manifest mode with builtin-baseline. vcpkg resolves
        # ports from its versions database in manifest mode, so local
        # changes by ports.patch are ignored unless the patched ports
        # are used as overlay ports.
        vcpkg_ports_dir=$(cygpath --mixed "$(pwd)/vcpkg/ports")
        overlay_ports=()
        for port in $(sed -n -E 's,^diff --git a/ports/([^/]+)/.*,\1,p' \
                        ci/vcpkg/ports.patch | sort -u); do
          overlay_ports+=("${vcpkg_ports_dir}/${port}")
        done
        echo "VCPKG_OVERLAY_PORTS=$(IFS=';'; echo "${overlay_ports[*]}")" >> "${GITHUB_ENV}"
    - name: Setup NuGet credentials for vcpkg caching
      shell: bash
      run: |
        $(vcpkg fetch nuget | tail -n 1) \
          sources add \
          -source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "$GITHUB_REPOSITORY_OWNER" \
          -password "${{ inputs.github-token }}"
        $(vcpkg fetch nuget | tail -n 1) \
          setapikey "${{ inputs.github-token }}" \
          -source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json"
    - name: Find Visual Studio
      shell: pwsh
      run: |
        "VS_INSTALL_PATH=$(vswhere -latest -property installationPath)" >> $env:GITHUB_ENV
    - name: Build
      shell: cmd
      run: |
        set VCPKG_ROOT_KEEP=%VCPKG_ROOT%
        call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
        set VCPKG_ROOT=%VCPKG_ROOT_KEEP%
        bash -c "ci/scripts/cpp_build.sh $(pwd) $(pwd)/build"
    - name: Register Flight SQL ODBC Driver
      shell: cmd
      run: |
        call "cpp\src\arrow\flight\sql\odbc\tests\install_odbc.cmd" ${{ github.workspace }}\build\cpp\%ARROW_BUILD_TYPE%\arrow_flight_sql_odbc.dll
